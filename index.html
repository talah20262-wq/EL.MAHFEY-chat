<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Chat 333 - Realtime</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        /* التنسيق الأساسي */
        body { font-family: sans-serif; background: #ece5dd; margin: 0; padding: 0; }
        #auth, #chat { display: none; flex-direction: column; height: 100vh; }
        .header { background: #075e54; color: white; padding: 15px; text-align: center; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
        .msg { padding: 10px; margin: 5px; border-radius: 8px; max-width: 80%; position: relative; }
        .sent { background: #dcf8c6; align-self: flex-end; }
        .recv { background: white; align-self: flex-start; }
        .input-area { background: #f0f0f0; padding: 10px; display: flex; }
        input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc; outline: none; }
        button { background: #128c7e; color: white; border: none; padding: 10px 20px; margin-right: 5px; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="auth" style="display: flex;">
        <div style="margin: auto; text-align: center; background: white; padding: 30px; border-radius: 10px;">
            <h2>سجل اسمك للحصول على رقم</h2>
            <input type="text" id="username" placeholder="اسمك">
            <button onclick="login()">دخول</button>
        </div>
    </div>

    <div id="chat">
        <div class="header" id="myHeader">دردشة</div>
        <div id="messages"></div>
        <div class="input-area">
            <input type="text" id="msgText" placeholder="اكتب رسالتك هنا...">
            <button onclick="send()">إرسال</button>
        </div>
    </div>

<script>
    // --- إعدادات Firebase (ضع بياناتك هنا) ---
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        databaseURL: "YOUR_DATABASE_URL",
        projectId: "YOUR_PROJECT_ID",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = {};

    function login() {
        const name = document.getElementById('username').value;
        if(!name) return;
        
        // توليد رقم ثلاثي عشوائي
        const ids = [111, 222, 333, 444, 555, 666, 777, 888, 999];
        const myId = ids[Math.floor(Math.random() * ids.length)];
        
        currentUser = { name: name, id: myId };
        
        document.getElementById('auth').style.display = 'none';
        document.getElementById('chat').style.display = 'flex';
        document.getElementById('myHeader').innerText = `أنت: ${name} (${myId})`;
        
        loadMessages();
    }

    function send() {
        const text = document.getElementById('msgText').value;
        if(!text) return;

        // إرسال البيانات للسيرفر
        db.ref("global_chat").push({
            senderId: currentUser.id,
            senderName: currentUser.name,
            text: text,
            time: Date.now()
        });

        document.getElementById('msgText').value = "";
    }

    function loadMessages() {
        // الاستماع للرسائل الجديدة فور وصولها من السيرفر
        db.ref("global_chat").on("child_added", (snapshot) => {
            const data = snapshot.val();
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('msg');
            msgDiv.classList.add(data.senderId === currentUser.id ? 'sent' : 'recv');
            msgDiv.innerHTML = `<b>${data.senderName} (${data.senderId}):</b><br>${data.text}`;
            document.getElementById('messages').appendChild(msgDiv);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        });
    }
</script>
</body>
</html>
