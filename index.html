<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat 333 | نظام الدردشة العالمي</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        :root { --primary: #075e54; --secondary: #128c7e; --bg: #e5ddd5; --white: #ffffff; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: #d1d7db; }
        
        /* شاشة الدخول */
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: var(--primary); color: white; }
        .login-box { background: white; padding: 30px; border-radius: 15px; color: #333; width: 85%; max-width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        
        /* شاشة الدردشة */
        #chat-screen { display: none; flex-direction: column; height: 100vh; max-width: 500px; margin: auto; background: var(--bg); position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .header { background: var(--primary); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        
        #message-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 12px; max-width: 75%; position: relative; font-size: 15px; line-height: 1.4; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .sent { background: #dcf8c6; align-self: flex-end; border-top-right-radius: 0; }
        .recv { background: white; align-self: flex-start; border-top-left-radius: 0; }
        .msg-info { font-size: 10px; color: #666; display: block; margin-bottom: 4px; }
        
        .footer { background: #f0f0f0; padding: 10px; display: flex; gap: 8px; align-items: center; }
        input { border: none; padding: 12px 15px; border-radius: 25px; flex: 1; outline: none; font-size: 15px; }
        button { background: var(--secondary); color: white; border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer; font-weight: bold; }
        
        .status-dot { width: 10px; height: 10px; background: #45f542; border-radius: 50%; display: inline-block; margin-left: 5px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2 style="margin-top:0">Chat 333 🔒</h2>
            <p>سجل اسمك للحصول على رقمك الثلاثي المشفر</p>
            <input type="text" id="nameInput" placeholder="ادخل اسمك هنا..." style="width: 80%; border: 1px solid #ddd; margin-bottom: 15px;">
            <button onclick="connect()" style="width: 90%;">دخول الآن</button>
        </div>
    </div>

    <div id="chat-screen">
        <div class="header">
            <div><span class="status-dot"></span> <span id="display-name">...</span></div>
            <div id="display-id" style="font-size: 14px; opacity: 0.8;">#000</div>
        </div>

        <div id="message-container">
            <center><small style="color: #888; background: #fff; padding: 4px 10px; border-radius: 10px;">🔒 الرسائل مشفرة بنظام End-to-End</small></center>
        </div>

        <div class="footer">
            <input type="text" id="messageInput" placeholder="اكتب رسالة..." onkeypress="handleKey(event)">
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>

<script>
    // بيانات الربط الخاصة بك
    const API_KEY = 'vamcxg.lgORjg:To4g-O91a63EH8inHht8u2NMlprtwPMRQLyh_iqG9b4';
    let ably, channel, myProfile = {};

    async function connect() {
        const name = document.getElementById('nameInput').value;
        if (!name) return alert("من فضلك ادخل اسمك");

        // نظام الأرقام الثلاثية المتشابهة
        const triples = [111, 222, 333, 444, 555, 666, 777, 888, 999];
        const randomId = triples[Math.floor(Math.random() * triples.length)];
        
        myProfile = { name: name, id: randomId };

        // بدء الاتصال بـ Ably أونلاين
        ably = new Ably.Realtime(API_KEY);
        channel = ably.channels.get('global-chat');

        // الاستماع للرسائل القادمة
        channel.subscribe('msg', (payload) => {
            renderMessage(payload.data);
        });

        // تبديل الشاشات
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';
        document.getElementById('display-name').innerText = name;
        document.getElementById('display-id').innerText = "#" + randomId;
    }

    function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;

        // إرسال البيانات
        channel.publish('msg', {
            sender: myProfile.name,
            senderId: myProfile.id,
            text: text,
            timestamp: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
        });

        input.value = '';
    }

    function renderMessage(data) {
        const container = document.getElementById('message-container');
        const isMe = data.senderId === myProfile.id;
        
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${isMe ? 'sent' : 'recv'}`;
        
        msgDiv.innerHTML = `
            <span class="msg-info">${data.sender} (${data.senderId})</span>
            ${data.text}
            <div style="font-size: 9px; text-align: left; margin-top: 4px; opacity: 0.6;">${data.timestamp}</div>
        `;
        
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight; // النزول لآخر رسالة تلقائياً
    }

    function handleKey(e) {
        if (e.key === 'Enter') sendMessage();
    }
</script>

</body>
</html>
